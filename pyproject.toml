[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coupon-incrementality"
version = "1.0.0"
description = "Causal measurement of grocery coupon campaigns: incremental profit per coupon dollar and who to target."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "doubleml>=0.9",
    "econml>=0.15",
    "pyfixest>=0.28",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["warehouse: needs the built DuckDB warehouse (run `make data` first)"]

[tool.ruff.lint.per-file-ignores]
# report.py assembles markdown tables; wrapping every row would hurt readability.
"src/coupon_incrementality/report.py" = ["E501"]
