version: 2

models:
  - name: stg_transactions
    description: One row per basket line.
    columns:
      - name: household_id
        tests: [not_null]
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: basket_id
        tests: [not_null]
      - name: week
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 1, max_value: "{{ var('last_week') }}"}
      - name: sales_value
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0}
      - name: retail_disc
        tests:
          - accepted_range:
              arguments: {min_value: 0}
      - name: coupon_disc
        tests:
          - accepted_range:
              arguments: {min_value: 0}
      - name: coupon_match_disc
        tests:
          - accepted_range:
              arguments: {min_value: 0}

  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: department
        tests: [not_null]

  - name: stg_campaign_descriptions
    columns:
      - name: campaign_id
        tests: [unique, not_null]
      - name: campaign_type
        tests:
          - accepted_values:
              arguments:
                values: ["A", "B", "C"]
      - name: end_date
        tests:
          - not_null

  - name: stg_campaigns
    tests:
      - unique_combination:
          arguments:
            columns: [campaign_id, household_id]
    columns:
      - name: campaign_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_campaign_descriptions')
                field: campaign_id

  - name: stg_coupons
    tests:
      - unique_combination:
          arguments:
            columns: [coupon_upc, product_id, campaign_id]
    columns:
      - name: campaign_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_campaign_descriptions')
                field: campaign_id

  - name: stg_coupon_redemptions
    columns:
      - name: household_id
        tests: [not_null]
      - name: campaign_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_campaign_descriptions')
                field: campaign_id

  - name: stg_promotions
    columns:
      - name: product_id
        tests: [not_null]
      - name: week
        tests:
          - accepted_range:
              arguments: {min_value: 1, max_value: "{{ var('last_week') }}"}

  - name: stg_demographics
    columns:
      - name: household_id
        tests: [unique, not_null]
