name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: make install

      - name: Lint
        run: make lint

      # Downloads the real dataset (31 MB), builds the warehouse and runs all dbt data tests.
      - name: Build warehouse and run data tests
        run: make data

      # Estimator tests on simulated data with known answers, plus checks on the warehouse.
      - name: Unit tests
        run: python -W ignore -m pytest -q
